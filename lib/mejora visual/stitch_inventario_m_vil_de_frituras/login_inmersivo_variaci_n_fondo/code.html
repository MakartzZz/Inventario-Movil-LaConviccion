<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Control Reparto - Iniciar Sesión</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Playfair+Display:wght@700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "primary": "#7c5800",
                "primary-container": "#e6a817",
                "on-primary-container": "#ffffff",
                "background": "#fff8f5",
                "on-background": "#29170c",
                "surface-variant": "#fedcc8",
                "on-surface-variant": "#504534",
                "outline": "#827561",
                "outline-variant": "#d4c4ad",
                "tertiary": "#934b19"
            },
            "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "2xl": "1rem",
                "full": "9999px"
            },
            "spacing": {
                "stack-sm": "0.5rem",
                "gutter-mobile": "1rem",
                "inset-squish": "0.75rem 1.25rem",
                "stack-lg": "1.5rem",
                "stack-md": "1rem",
                "margin-mobile": "1.25rem"
            },
            "fontFamily": {
                "sans": ["Plus Jakarta Sans", "ui-sans-serif", "system-ui"],
                "serif": ["Playfair Display", "serif"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(230, 168, 23, 0.4);
        }
        .btn-active:active {
            transform: scale(0.98);
        }
        .bg-overlay {
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 100%);
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col items-center justify-center p-gutter-mobile font-sans text-on-background overflow-hidden">
<!-- Immersive Background -->
<div class="fixed inset-0 z-0">
<img alt="Background" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAz_GYb6Q-CxbSt1LGl9JC7x-CLpEHvHFLmALjATDE4c2UURmEuxDIepEXLs38Kynklm1Vla3pziKKdT3TMelXxVdqMvuj9Tfbv7b5aaa7sh_xkBtJoSn59catni3mRaFkYb1bIZ4vTzO5XlzSchp1FRhNi2_sJWfe53oKguSj3OCi6N5NxTN7ahH7kugt2Xrkd1iMSUcpSa_pMyIfbj7tzOhwSANTDUSugiDkSbasjZlddJU21ZemjLSdh-dq7uro9l8iL3MW8xGIL"/>
<div class="absolute inset-0 bg-overlay"></div>
</div>
<!-- Content Container -->
<div class="relative z-10 w-full max-w-[400px] flex flex-col items-center">
<!-- Brand Identity Header -->
<header class="flex flex-col items-center mb-stack-lg animate-in fade-in slide-in-from-top-4 duration-1000">
<div class="w-20 h-20 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center mb-stack-md shadow-[0_0_25px_rgba(255,255,255,0.3)] border border-white/30">
<span class="material-symbols-outlined text-white text-[40px]" style="font-variation-settings: 'FILL' 1;">
                    local_shipping
                </span>
</div>
<div class="text-center space-y-1">
<h1 class="text-sm uppercase tracking-[0.3em] text-white/90 font-bold mb-1">
                    Control Reparto
                </h1>
<h2 class="font-serif text-[42px] leading-tight text-white drop-shadow-md">
                    La Convicción
                </h2>
<p class="text-sm text-white/70 font-medium">
                    Inicia sesión para continuar
                </p>
</div>
</header>
<!-- Glassmorphism Login Card -->
<main class="w-full glass-panel rounded-2xl p-8 shadow-2xl animate-in fade-in zoom-in-95 duration-700 delay-150">
<form class="flex flex-col space-y-6" id="loginForm">
<!-- User Selection -->
<div class="space-y-2 group">
<label class="block text-[11px] font-bold uppercase tracking-wider text-on-surface-variant/80 ml-1" for="observer">
                        Observador
                    </label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline/70 transition-colors group-focus-within:text-primary-container">
                            person
                        </span>
<select class="w-full h-12 pl-12 pr-10 bg-white/40 border-transparent border rounded-xl focus:ring-2 focus:ring-primary-container/30 focus:border-primary-container focus:bg-white/80 transition-all duration-300 appearance-none cursor-pointer text-sm font-semibold text-on-background" id="observer">
<option value="temp_user">TempUser</option>
<option value="admin">Administrador</option>
<option value="reparto_1">Operador Reparto A</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline/70 pointer-events-none text-sm">
                            expand_more
                        </span>
</div>
</div>
<!-- PIN Input -->
<div class="space-y-2 group">
<label class="block text-[11px] font-bold uppercase tracking-wider text-on-surface-variant/80 ml-1" for="pin">
                        PIN
                    </label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline/70 transition-colors group-focus-within:text-primary-container">
                            lock
                        </span>
<input class="w-full h-12 pl-12 pr-12 bg-white/40 border-transparent border rounded-xl focus:ring-2 focus:ring-primary-container/30 focus:border-primary-container focus:bg-white/80 transition-all duration-300 text-sm font-semibold text-on-background placeholder:text-outline/50" id="pin" placeholder="••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline/70 hover:text-primary transition-colors focus:outline-none" onclick="toggleVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility_icon">
                                visibility_off
                            </span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-12 mt-2 bg-primary-container hover:bg-[#D49815] text-white font-bold text-sm rounded-xl shadow-lg shadow-primary-container/20 transition-all duration-300 btn-glow btn-active flex items-center justify-center gap-2" type="submit">
                    INGRESAR
                    <span class="material-symbols-outlined text-[18px]">
                        login
                    </span>
</button>
</form>
</main>
<!-- Footer Meta -->
<footer class="mt-8 text-center animate-in fade-in duration-1000 delay-300">
<p class="text-[11px] font-bold tracking-[0.2em] text-white/50 uppercase">
                v1.2.0
            </p>
</footer>
</div>
<!-- Micro-interactions & Effects -->
<script>
        function toggleVisibility() {
            const pinInput = document.getElementById('pin');
            const icon = document.getElementById('visibility_icon');
            if (pinInput.type === 'password') {
                pinInput.type = 'text';
                icon.textContent = 'visibility';
            } else {
                pinInput.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }

        const form = document.getElementById('loginForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin material-symbols-outlined text-[18px]">sync</span> CARGANDO...';
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span> BIENVENIDO';
                btn.classList.replace('bg-primary-container', 'bg-tertiary');
                
                setTimeout(() => {
                    alert('Inicio de sesión exitoso');
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-tertiary', 'bg-primary-container');
                }, 1000);
            }, 1500);
        });
    </script>
</body></html>
